stages:
  - build

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

build_windows_x64:
  stage: build
  tags:
    - WindowsBuilder
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - cd native
    - cmd.exe /c "build-windows.bat x64"
  artifacts:
    paths:
      - native/build/Release/*

build_windows_arm64:
  stage: build
  tags:
    - WindowsBuilder
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - cd native
    - cmd.exe /c "build-windows.bat arm64"
  artifacts:
    paths:
      - native/build/Release/*

.build_linux:
  stage: build
  timeout: 3h
  resource_group: justcef-linux-$LINUX_ARCH-release
  tags:
    - LinuxBuilder
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - bash native/build-linux.sh "$LINUX_ARCH"
    - bash native/ci/publish-linux.sh "$LINUX_ARCH"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/linux-$LINUX_ARCH/

build_linux_x64:
  extends: .build_linux
  variables:
    LINUX_ARCH: x64

build_linux_arm64:
  extends: .build_linux
  variables:
    LINUX_ARCH: arm64
