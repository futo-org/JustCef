stages:
  - build
  - publish

variables:
  LINUX_ARM64_RUNNER_TAG: LinuxBuilder

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

build_windows_x64:
  stage: build
  tags:
    - WindowsBuilder
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - cd native
    - cmd.exe /c "build-windows.bat x64"
  artifacts:
    paths:
      - native/build/Release/*

build_windows_arm64:
  stage: build
  tags:
    - WindowsBuilder
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - cd native
    - cmd.exe /c "build-windows.bat arm64"
  artifacts:
    paths:
      - native/build/Release/*

.build_linux:
  stage: build
  timeout: 3h
  tags:
    - LinuxBuilder
  rules:
    - when: on_success
  script:
    - bash native/build-linux.sh "$LINUX_ARCH"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/linux-$LINUX_ARCH/

build_linux_x64:
  extends: .build_linux
  variables:
    LINUX_ARCH: x64

build_linux_arm64:
  extends: .build_linux
  tags:
    - $LINUX_ARM64_RUNNER_TAG
  variables:
    LINUX_ARCH: arm64

publish_linux:
  stage: publish
  tags:
    - LinuxBuilder
  needs:
    - job: build_linux_x64
      artifacts: true
    - job: build_linux_arm64
      artifacts: true
  resource_group: justcef-linux-release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - bash native/ci/publish-linux.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/publish-linux.log
