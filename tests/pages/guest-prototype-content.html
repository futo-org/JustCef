<!doctype html><meta charset="utf-8"><title>Guest with DENY framing policy</title>
<style>body{font:16px system-ui;background:#d7f1e8;margin:0;padding:20px}input,textarea,button{font:inherit;padding:8px;margin:5px}#animation{height:45px;background:repeating-linear-gradient(90deg,#e43660 0 60px,#386add 60px 120px,#ffd343 120px 180px);background-size:360px;animation:slide 1s linear infinite}@keyframes slide{to{background-position:360px}}#scroll{height:140px;overflow:auto;border:2px solid #458;margin:10px 0;width:400px}#scroll div{height:700px;background:linear-gradient(#bce,#87a)}#spacer{height:950px;background:linear-gradient(#d7f1e8,#357ca0)}</style>
<div id="animation"></div><h2>Independent browser document</h2><p>This response sends X-Frame-Options: DENY and CSP frame-ancestors 'none'.</p><p id="identity"></p><button id="click">Child clicks: 0</button><input id="text" placeholder="Type, arrows, backspace, IME"><textarea id="textarea" placeholder="Multiline text"></textarea><p id="clock"></p><div id="scroll"><div>Nested scroll container. Scroll here, reach its boundary, and keep scrolling.</div></div><video id="video" controls muted playsinline loop width="480"></video><p id="videoStatus">No local video fixture configured.</p><div id="spacer">Scroll the document.</div>
<script>let clicks=0;document.querySelector('#click').onclick=()=>document.querySelector('#click').textContent=`Child clicks: ${++clicks}`;document.querySelector('#identity').textContent=JSON.stringify({topIsSelf:top===self,parentIsSelf:parent===self,frameElement:!!frameElement,referrer:document.referrer,ancestors:Array.from(location.ancestorOrigins)});setInterval(()=>document.querySelector('#clock').textContent='Live '+Date.now(),80);fetch('/video-available').then(r=>r.json()).then(({available})=>{if(available){document.querySelector('#video').src='/fixture.webm';document.querySelector('#videoStatus').textContent='Local video: press Play'}});</script>
