<!doctype html><meta charset="utf-8"><title>JustCef compositor embedding demo</title>
<script>window.protoErrors=[];addEventListener("error",e=>protoErrors.push(e.message||e.detail),true)</script>
<style>html,body{margin:0;height:100%;font:15px system-ui;background:#edf0f5;color:#172331}body{display:flex;flex-direction:column}header{padding:12px;position:relative;z-index:2;box-shadow:0 1px 4px #0003}nav{display:flex;gap:6px}button,input{font:inherit;padding:8px}#address{flex:1;min-width:100px}#view{display:block;position:relative;flex:1;min-height:0;background:white;overflow:hidden}#suggestions{position:absolute;top:100%;left:110px;right:90px;border:1px solid #bbb;border-radius:0 0 12px 12px;background:#fffef2e8;backdrop-filter:blur(4px);padding:18px;box-shadow:0 8px 15px #0003}#suggestions[hidden]{display:none}#status{font-size:12px;margin-top:7px}dialog{border:1px solid #aaa;border-radius:16px;padding:30px}dialog::backdrop{background:#1236}#overlayInput{width:220px}</style>
<header><nav><button id="back">←</button><button id="forward">→</button><input id="address" aria-label="Address"><button id="go">Go</button></nav><p><button id="fixture">Local fixture</button><button id="youtube">YouTube</button><button id="cover">Suggestions</button><button id="modal">Dialog</button><button id="rotate">Transform</button></p><div id="status">Waiting for guest attachment…</div><section id="suggestions" hidden><strong>Host HTML above the live browser</strong><p>Video and animation should continue underneath.</p><button id="overlayButton">Overlay clicks: 0</button><input id="overlayInput" placeholder="Host input"><p><button id="dismiss">Dismiss suggestions</button></p></section></header>
<justcef-view id="view" src="guest-prototype-content.html"></justcef-view>
<dialog id="dialog"><h2>Host HTML dialog</h2><input placeholder="Host modal input"><button id="close">Close</button></dialog>
<script>
const $=s=>document.querySelector(s),view=$('#view');let attached=false,overlayClicks=0;
function navigate(url){$('#suggestions').hidden=true;view.setAttribute('src',new URL(url,location.href).href);$('#address').value=view.getAttribute('src')}
$('#go').onclick=()=>navigate($('#address').value);$('#address').addEventListener('keydown',e=>{if(e.key==='Enter')navigate(e.target.value)});$('#address').onfocus=()=>$('#suggestions').hidden=false;$('#fixture').onclick=()=>navigate('guest-prototype-content.html');$('#youtube').onclick=()=>navigate('https://www.youtube.com/');$('#cover').onclick=()=>$('#suggestions').hidden=!$('#suggestions').hidden;$('#dismiss').onclick=()=>$('#suggestions').hidden=true;$('#modal').onclick=()=>$('#dialog').showModal();$('#close').onclick=()=>$('#dialog').close();$('#back').onclick=()=>view.goBack();$('#forward').onclick=()=>view.goForward();$('#rotate').onclick=()=>view.style.transform=view.style.transform?'':'scale(.94) rotate(2deg)';$('#overlayButton').onclick=()=>$('#overlayButton').textContent=`Overlay clicks: ${++overlayClicks}`;
view.addEventListener('guestattached',()=>{attached=true;$('#status').textContent='Guest attached through Chromium — no pixel transfer'});view.addEventListener('error',e=>$('#status').textContent='Error: '+JSON.stringify(e.detail));view.addEventListener('load',e=>$('#address').value=e.detail?.url||view.getAttribute('src'));$('#address').value=new URL('guest-prototype-content.html',location.href).href;
</script>
